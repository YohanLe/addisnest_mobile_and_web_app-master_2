// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// NOTE: Repository declarations have been moved to settings.gradle
// via dependencyResolutionManagement to suppress the Gradle 9.0
// deprecation warning about allprojects{} repository blocks.

tasks.register('clean', Delete) {
    // Use layout.buildDirectory instead of the deprecated buildDir property
    delete layout.buildDirectory
}
